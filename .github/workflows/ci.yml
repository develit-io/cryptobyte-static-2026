name: Static archive checks and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-archive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build static archive
        run: bun run build

      - name: Install test browser
        run: bunx playwright install --with-deps chromium

      - name: Test all pages with external requests blocked
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .output/public > /tmp/cryptobyte-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          bun run test:static

      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-verification
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save deployable static files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cryptobyte-static-2026
          path: .output/public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Ensure Cloudflare Pages project exists
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/manage-cloudflare-pages.mjs setup

      - name: Deploy verified static files to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: bunx --no-install wrangler pages deploy .output/public --project-name cryptobyte-static-2026 --branch main

      - name: Ensure archive custom domain and DNS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/manage-cloudflare-pages.mjs domain

      - name: Wait for custom domain HTTPS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: curl --fail --silent --show-error --location --retry 20 --retry-all-errors --retry-delay 15 --max-time 20 --output /dev/null https://2026.cryptobyte.cz/

      - name: Verify deployed archive in browser
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          STATIC_TEST_ORIGIN: https://2026.cryptobyte.cz
        run: bun run test:static
